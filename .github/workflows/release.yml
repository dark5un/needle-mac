# needle-mac — release builds. Mirrors the rhema release pipeline: actions
# pinned to exact SHAs, Developer ID signing + notarization gated behind the
# protected 'signing' environment with a required reviewer. Pushing a v* tag
# (or a manual run) builds the universal .app, signs it with Developer ID,
# notarizes + staples, and publishes tar.gz + DMG as a GitHub Release.
#
# The 'signing' environment needs these secrets (same values as rhema's):
#   SIGNING_P12           base64 of a .p12 holding the Developer ID cert+key
#   SIGNING_P12_PASSWORD  password for that .p12
#   APPLE_API_KEY         .p8 App Store Connect API key content
#   APPLE_API_KEY_ID      key ID
#   APPLE_API_ISSUER_ID   issuer UUID
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    # Protected environment: the secrets below exist ONLY here, and every
    # run of this job waits for its required reviewer to approve before
    # the signing key material is exposed to it.
    environment: signing
    env:
      CODESIGN_IDENTITY: "Developer ID Application: Panagiotis Xynos (R2XM78R4TE)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import Developer ID certificate into a temporary keychain
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          printf '%s' "$SIGNING_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" \
            -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$RUNNER_TEMP" "$KEYCHAIN"
          security find-identity -p codesigning -v | grep -F "$CODESIGN_IDENTITY"
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}

      - name: Build + package (Developer ID, hardened runtime)
        run: ./make_package.sh

      - name: Notarize and staple
        run: |
          set -eu
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/asconnect.p8"
          VER=$(sed -n 's|.*CFBundleShortVersionString</key><string>\(.*\)</string>.*|\1|p' Info.plist)
          # notarize the app itself, then staple the .app so BOTH artifacts
          # (tarball and DMG) ship a stapled bundle
          ditto -c -k --keepParent NeedleMac.app "$RUNNER_TEMP/needle-mac-app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/needle-mac-app.zip" \
            --key "$RUNNER_TEMP/asconnect.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple NeedleMac.app
          xcrun stapler validate NeedleMac.app
          # rebuild the artifacts around the stapled app
          cp -R NeedleMac.app dist/needle-mac/NeedleMac.app
          rm -f dist/needle-mac-*-macos.tar.gz dist/needle-mac-*-macos.dmg
          tar -czf "dist/needle-mac-${VER}-macos.tar.gz" -C dist needle-mac
          DMG_DIR="dist/dmg-root"
          rm -rf "$DMG_DIR"; mkdir -p "$DMG_DIR"
          cp -R NeedleMac.app "$DMG_DIR/"
          cp README.md "$DMG_DIR/README.md"
          cp install-package.sh "$DMG_DIR/install.command"
          chmod +x "$DMG_DIR/install.command"
          hdiutil create -volname "needle-mac" -srcfolder "$DMG_DIR" -ov -format UDZO \
            "dist/needle-mac-${VER}-macos.dmg" >/dev/null
          rm -rf "$DMG_DIR"
          # no DMG-level staple: the .app inside is stapled (that is what
          # offline verification needs); the DMG itself was never submitted
          # to Apple, so stapler has no ticket for it.
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Publish GitHub Release
        run: |
          gh release create "$REF" dist/needle-mac-*-macos.tar.gz dist/needle-mac-*-macos.dmg \
            --title "needle-mac $REF" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
